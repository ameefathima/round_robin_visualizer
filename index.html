<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round Robin CPU Scheduling Visualizer</title>

<style>
:root {
  --bg: #f4f1fb;
  --panel: rgba(255,255,255,.94);
  --panel2: #f0ebfa;
  --line: #e3dcef;
  --text: #29253d;
  --muted: #77728b;
  --yellow: #8b5cf6;
  --green: #0f9f85;
  --red: #e05278;
  --blue: #4f6bed;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  font-family: Inter, system-ui, Segoe UI, sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #e6ddff 0 10%, transparent 10.2%),
    radial-gradient(circle at 92% 92%, #d8f4ec 0 11%, transparent 11.2%),
    linear-gradient(135deg, #f7f4fc, #f1f5fb 52%, #f9f6ff);
  min-height: 100vh;
  padding: 18px;
}

h1, h2, p {
  margin: 0;
}

h1 {
  font-size: clamp(21px, 3vw, 30px);
}

h2 {
  font-size: 18px;
  margin-bottom: 14px;
}

.sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.layout {
  max-width: 1500px;
  margin: auto;
  display: grid;
  grid-template-columns: minmax(290px, .85fr) minmax(0, 1.4fr);
  gap: 16px;
}

.panel {
  background: var(--panel);
  border: 1px solid #20394b;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 12px 32px #4a3b6710;
  backdrop-filter: blur(5px);
}

.wide {
  grid-column: 1 / -1;
}

.hero {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 16px;
}

.clock {
  font-size: 18px;
  font-weight: 800;
  padding: 10px 14px;
  border-radius: 10px;
  background: #eee8fb;
  color: #5a3d9c;
  white-space: nowrap;
}

.bigstatus {
  font-size: 26px;
  font-weight: 900;
  margin: 12px 0 18px;
}

.idle {
  color: var(--red);
}

.running {
  color: var(--green);
}

.formgrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 13px;
}

.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 5px;
}

.field input,
.field select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: #fbfaff;
  border: 1px solid #dcd5eb;
  color: var(--text);
  font-size: 14px;
}

.btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

button {
  background: #f0ebfa;
  border: 1px solid #ddd4ee;
  color: #38314d;
  border-radius: 9px;
  padding: 10px 14px;
  font-weight: 750;
  cursor: pointer;
}

button.primary {
  background: #7653d6;
  color: #fff;
  border-color: #7653d6;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.tablewrap {
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th,
td {
  text-align: center;
  padding: 12px 9px;
  border-bottom: 1px solid #eee8f5;
  font-size: 14px;
}

/* Updated table headings */
th {
  color: #29253d;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.3px;
}

td:first-child,
th:first-child {
  text-align: left;
}

.statusbar {
  height: 18px;
  min-width: 100px;
  background: #e9e3f2;
  border-radius: 7px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: var(--yellow);
  width: 0%;
  transition: width .2s;
  border-radius: 7px;
}

.fill.current {
  background: var(--green);
}

.queue {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  min-height: 44px;
}

.qitem {
  padding: 10px 13px;
  background: #e8e1fb;
  border: 1px solid #cfc1f5;
  border-radius: 9px;
  color: #4b347f;
  font-weight: 800;
}

.qitem:first-child {
  border-color: #8b5cf6;
  box-shadow: 0 0 0 1px #8b5cf650;
}

.qitem.dispatched {
  position: relative;
  opacity: .65;
}

.qitem.dispatched:after {
  content: '';
  position: absolute;
  left: 4px;
  right: 4px;
  top: 50%;
  height: 2px;
  background: #e05278;
  transform: rotate(-18deg);
  transform-origin: center;
}

.empty {
  color: var(--muted);
  font-style: italic;
  font-size: 13px;
}

.gantt-scroll {
  overflow-x: auto;
  padding: 8px 0 12px;
}

.gantt {
  display: flex;
  min-width: max-content;
  align-items: stretch;
}

.gseg {
  position: relative;
  min-width: 62px;
  height: 60px;
  padding: 9px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  border-right: 2px solid #071a29;
  background: #8b5cf6;
  color: #fff;
}

.gseg.cs {
  background: #18a58d;
}

.gseg.idle {
  background: #d9d4e5;
  color: #4c4760;
}

.gseg.active {
  outline: 3px solid white;
  outline-offset: -4px;
  filter: brightness(1.2);
}

.ticks {
  display: flex;
  min-width: max-content;
}

.tick {
  min-width: 62px;
  font-size: 11px;
  color: var(--muted);
  padding-top: 5px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.metric {
  background: #faf8ff;
  border: 1px solid #e7e0f1;
  border-radius: 10px;
  padding: 14px;
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.metric strong {
  display: block;
  font-size: 23px;
  margin-top: 6px;
}

.processes {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
}

.proc {
  padding: 10px;
  background: #faf8ff;
  border: 1px solid #e7e0f1;
  border-radius: 9px;
}

.proc label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}

.proc input {
  width: 100%;
  background: #fff;
  border: 1px solid #dcd5eb;
  color: #29253d;
  padding: 8px;
  border-radius: 6px;
}

.note {
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  background: #e9e3f5;
  border-radius: 7px;
  font-size: 12px;
  color: #594b7c;
}

@media (max-width: 850px) {
  body {
    padding: 10px;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  .wide {
    grid-column: auto
